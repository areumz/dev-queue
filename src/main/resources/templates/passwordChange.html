<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-wide">
    <div class="card" style="max-width:420px; margin:0 auto;">
        <h2 style="margin-bottom:12px;">비밀번호 변경</h2>

        <form th:action="@{/mypage/password}" th:object="${passwordChangeForm}" method="post">
            <div style="margin-bottom:8px;">
                <input type="password" th:field="*{currentPassword}" placeholder="현재 비밀번호">
                <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" style="color:#C0392B; font-size:12px; margin-top:4px;"></p>
            </div>
            <div style="margin-bottom:14px;">
                <input type="password" th:field="*{newPassword}" placeholder="새 비밀번호 (8자 이상)">
                <p style="font-size:12px; color:#888; margin-top:4px;">8자 이상, 72바이트 이하(한글은 약 24자까지)</p>
                <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="color:#C0392B; font-size:12px; margin-top:4px;"></p>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">비밀번호 변경</button>
        </form>
        <p style="margin-top:12px;"><a th:href="@{/mypage}">마이페이지로 돌아가기</a></p>
    </div>
</div>
</body>
</html>
