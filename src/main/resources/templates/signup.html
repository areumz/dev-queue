<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<form th:action="@{/signup}"  th:object="${signupForm}" method="post">
    <input type="text" th:field="*{username}" placeholder="아이디">
    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red;"></p>
    <input type="password" th:field="*{password}" placeholder="비밀번호">
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></p>
    <input type="text" th:field="*{nickname}" placeholder="닉네임">
    <p th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" style="color:red;"></p>
    <button type="submit">회원가입</button>
</form>
<a href="/login">이미 계정이 있으신가요? 로그인</a>

</body>
</html>
