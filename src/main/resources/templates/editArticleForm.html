<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="header">
    <a th:href="@{/articles}" class="brand" style="font-size:28px; text-decoration:none; color:inherit;">DevQueue</a>
</div>

<div class="container">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:1.25rem;">
        <a th:href="@{/articles/{id}(id=${article.id})}" style="color:#555; text-decoration:none;">←</a>
        <h3 style="margin:0;">링크 수정</h3>
    </div>

    <div class="card">
        <form th:action="@{/articles/{id}/edit(id=${article.id})}" method="post">
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#888; display:block; margin-bottom:6px;">제목</label>
                <input type="text" name="title" th:value="${article.title}">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#888; display:block; margin-bottom:6px;">URL</label>
                <input type="text" name="url" th:value="${article.url}">
            </div>
            <div style="margin-bottom:14px;">
                <label style="font-size:13px; color:#888; display:block; margin-bottom:6px;">카테고리</label>
                <select name="category">
                    <option value="DEV_DOC" th:selected="${article.category.name() == 'DEV_DOC'}">개발문서</option>
                    <option value="AI" th:selected="${article.category.name() == 'AI'}">AI</option>
                    <option value="JOB" th:selected="${article.category.name() == 'JOB'}">채용정보</option>
                    <option value="ETC" th:selected="${article.category.name() == 'ETC'}">기타</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">저장</button>
        </form>
    </div>
</div>

</body>
</html>
