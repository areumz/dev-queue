<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="center-screen" style="display:flex; justify-content:center; padding-top:4rem;">
    <div class="card" style="width:320px;">
        <h2 style="margin-bottom:6px;">비밀번호 찾기</h2>
        <p style="font-size:13px; color:#888; margin-bottom:14px;">가입 때 등록하고 인증한 이메일을 입력해 주세요. 재설정 링크를 보내드려요.</p>
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
            <div style="margin-bottom:14px;">
                <input type="text" th:field="*{email}" placeholder="이메일">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#C0392B; font-size:12px; margin-top:4px;"></p>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">재설정 메일 보내기</button>
        </form>
        <p style="font-size:13px; text-align:center; margin-top:14px;"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
</div>
</body>
</html>
