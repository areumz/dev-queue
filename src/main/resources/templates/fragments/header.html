<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header" class="header">
    <div style="display:flex; align-items:center; gap:8px;">
        <a th:href="@{/articles}" class="brand" style="font-size:28px; text-decoration:none; color:inherit;">DevQueue</a>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
        <a th:href="@{/mypage}" style="font-size:14px; color:#555;" th:text="${loginUser.nickname} + '님'"></a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-secondary" style="padding:6px 14px; font-size:13px;">로그아웃</button>
        </form>
    </div>
</div>
</body>
</html>
