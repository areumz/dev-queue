<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 주소에 토큰이 있는 페이지라서, 다른 사이트로 가는 요청에 주소(Referer)를 실어 보내지 않게 한다 -->
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="center-screen" style="display:flex; justify-content:center; padding-top:4rem;">
    <div class="card" style="width:320px;">
        <h2 style="margin-bottom:12px;">새 비밀번호 정하기</h2>
        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
            <input type="hidden" th:field="*{token}">
            <div style="margin-bottom:14px;">
                <input type="password" th:field="*{newPassword}" placeholder="새 비밀번호 (8자 이상)">
                <p style="font-size:12px; color:#888; margin-top:4px;">8자 이상, 72바이트 이하(한글은 약 24자까지)</p>
                <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="color:#C0392B; font-size:12px; margin-top:4px;"></p>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">비밀번호 바꾸기</button>
        </form>
    </div>
</div>
</body>
</html>
